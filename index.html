<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOHECO Logistics Command Center</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<!-- SUPABASE SETUP (run once in SQL editor). Replace the two emails with your 2 primary users.
create table shipments(source text,awb text,order_no text,d jsonb,primary key(source,awb));
alter table shipments enable row level security;
create policy "read" on shipments for select to authenticated using(true);
create policy "ins" on shipments for insert to authenticated with check((auth.jwt()->>'email') in ('primary1@company.com','primary2@company.com'));
create policy "upd" on shipments for update to authenticated using((auth.jwt()->>'email') in ('primary1@company.com','primary2@company.com')) with check((auth.jwt()->>'email') in ('primary1@company.com','primary2@company.com'));
Then create users in Authentication > Users (disable public sign-ups). Set CFG below. -->
<style>
:root{--n:#0f172a;--b:#2563eb;--bg:#f1f5f9;--c:#fff;--m:#64748b;--l:#e2e8f0}
*{box-sizing:border-box}body{margin:0;font:13px/1.45 -apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--n)}
header{background:var(--n);color:#fff;padding:10px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:20}
header h1{font-size:16px;margin:0;flex:1}button{background:var(--b);color:#fff;border:0;border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:600}button.g{background:#334155}button:hover{opacity:.9}
#login{max-width:340px;margin:12vh auto;background:var(--c);padding:28px;border-radius:12px;box-shadow:0 8px 30px #0002}#login input{width:100%;padding:9px;margin:6px 0;border:1px solid var(--l);border-radius:6px}
.fb{display:flex;gap:8px;flex-wrap:wrap;padding:12px 20px;background:var(--c);border-bottom:1px solid var(--l);align-items:center}
.ms{position:relative}.ms>summary{list-style:none;border:1px solid var(--l);border-radius:6px;padding:6px 10px;cursor:pointer;background:#f8fafc;white-space:nowrap}.ms[open]>summary{border-color:var(--b)}
.ms>div{position:absolute;top:34px;left:0;z-index:30;background:#fff;border:1px solid var(--l);border-radius:8px;box-shadow:0 8px 24px #0002;width:230px;max-height:280px;overflow:auto;padding:8px}
.ms label{display:block;padding:2px 0;cursor:pointer}.ms input[type=search]{width:100%;padding:5px;margin-bottom:6px;border:1px solid var(--l);border-radius:4px}
.fb input[type=date]{border:1px solid var(--l);border-radius:6px;padding:5px}
nav{display:flex;gap:4px;padding:8px 20px 0;overflow:auto}nav a{padding:8px 14px;border-radius:8px 8px 0 0;cursor:pointer;color:var(--m);font-weight:600;white-space:nowrap}nav a.on{background:var(--c);color:var(--b)}
main{padding:16px 20px;background:var(--c);margin:0 20px 20px;border-radius:0 8px 8px 8px;min-height:60vh}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}.k div{border:1px solid var(--l);border-radius:10px;padding:12px}.k b{display:block;font-size:22px;margin-top:2px}.k span{color:var(--m);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin-bottom:16px}.g2>div{border:1px solid var(--l);border-radius:10px;padding:12px}
table{width:100%;border-collapse:collapse}th{background:#f8fafc;text-align:left;position:sticky;top:0}th,td{padding:7px 9px;border-bottom:1px solid var(--l)}td.r,th.r{text-align:right}.w{max-height:520px;overflow:auto;border:1px solid var(--l);border-radius:8px}
.ins li{margin:6px 0}.h{color:#dc2626;font-weight:700}.mm{color:#d97706;font-weight:700}
#chat{height:380px;overflow:auto;border:1px solid var(--l);border-radius:10px;padding:12px;background:#f8fafc}.mg{margin:8px 0;padding:9px 12px;border-radius:10px;max-width:80%;white-space:pre-wrap}.u{background:var(--b);color:#fff;margin-left:auto}.a{background:#fff;border:1px solid var(--l)}
</style></head><body>
<div id="login" hidden><h2>BOHECO Command Center</h2><input id="em" placeholder="Email"><input id="pw" type="password" placeholder="Password"><button onclick="login()" style="width:100%">Sign in</button><p id="err" style="color:#dc2626"></p></div>
<div id="app" hidden>
<header><h1>📦 BOHECO Logistics Command Center</h1><span id="who"></span><span id="ad" hidden><button onclick="pick('iTL')">⬆ Upload ITL</button> <button onclick="pick('Blitz')">⬆ Upload Blitz</button></span><button onclick="dl()">⬇ Download Excel</button><button class="g" onclick="out()">Sign out</button></header>
<div class="fb" id="fb"></div><nav id="nav"></nav><main id="v"></main></div>
<script>
const CFG={url:'',key:'',admins:['primary1@company.com','primary2@company.com']}; // fill url + anon key
const sb=CFG.url?supabase.createClient(CFG.url,CFG.key):null;
let ALL=[],F=[],SEL={},DR={f:'',t:''},TAB='Overview',CH=[],IDX=new Map(),ADMIN=false;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const N=(n,d=1)=>n==null||isNaN(n)?'–':Number(n).toLocaleString('en-IN',{maximumFractionDigits:d}),P=x=>isNaN(x)||x==null?'–':(x*100).toFixed(1)+'%',fd=d=>d?new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}):'not available';
const FIELDS=[['wh','Pickup warehouse'],['state','State'],['city','City'],['courier','Courier'],['pay','Payment type'],['mode','Transport mode'],['status','Status'],['dir','Forward / RTO / RVP-DTO']];
const TABS=['Overview','Courier','State','City','Monthly Trend','Attempts','RTO','Open Queue','Raw Data','Assistant'];
const CS={Bengaluru:'Karnataka',Mysore:'Karnataka',Mumbai:'Maharashtra',Pune:'Maharashtra',MMR:'Maharashtra',Nashik:'Maharashtra',Delhi:'Delhi',Hyderabad:'Telangana',Chennai:'Tamil Nadu',Coimbatore:'Tamil Nadu',Surat:'Gujarat'};
const COLS=[['src','Source'],['courier','Courier'],['awb','AWB No'],['order','Order Number'],['date','Order Date'],['pay','Payment'],['status','Order Status'],['grp','Status Group'],['dir','Direction'],['mode','Transport Mode'],['att','Attempts'],['astat','Delivery Attempt Status'],['zone','Zone'],['wh','Pickup Warehouse'],['city','City'],['state','State'],['pin','Pincode'],['pick','Pickup Date'],['deliv','Delivered Date'],['tat','TAT (Days)'],['edd','EDD'],['age','Ageing'],['freight','Freight (INR)'],['ndr','NDR Status'],['remark','Remark / RTO Reason']];
// ---------- auth ----------
async function boot(){if(!sb)return start('demo@local');const{data}=await sb.auth.getSession();data.session?start(data.session.user.email):$('#login').hidden=false}
async function login(){const{data,error}=await sb.auth.signInWithPassword({email:$('#em').value,password:$('#pw').value});if(error)return $('#err').textContent=error.message;start(data.user.email)}
async function out(){if(sb)await sb.auth.signOut();location.reload()}
async function start(email){ADMIN=!sb||CFG.admins.map(x=>x.toLowerCase()).includes(email.toLowerCase());$('#login').hidden=true;$('#app').hidden=false;$('#who').textContent=email+(ADMIN?' · Admin':' · Viewer');$('#ad').hidden=!ADMIN;ALL=await load();ready()}
async function load(){if(!sb)return[];let o=[],f=0;for(;;){const{data,error}=await sb.from('shipments').select('d').range(f,f+999);if(error||!data.length)break;o.push(...data.map(r=>r.d));if(data.length<1000)break;f+=1000}return o}
// ---------- ingest ----------
const g=(r,...k)=>{for(const x of k){const v=r[x];if(v!=null&&v!=='')return v}};
const iso=v=>{if(v==null||typeof v=='number')return null;const d=v instanceof Date?v:new Date(v);return isNaN(d)?null:d.toISOString()};
const tc=s=>String(s||'').replace(/&amp;/g,'&').trim().replace(/\w\S*/g,w=>w[0].toUpperCase()+w.slice(1).toLowerCase());
const grp=s=>/rto/i.test(s)?(/deliver/i.test(s)?'RTO Delivered':'RTO In Progress'):/^delivered$/i.test(s)?'Delivered':/cancel/i.test(s)?'Cancelled':/lost/i.test(s)?'Lost':/damag/i.test(s)?'Damaged':/ndr|undeliver/i.test(s)?'NDR / Undelivered':'In Transit / Pending';
const isO=r=>/Transit|NDR/.test(r.grp);
function astat(r){const a=r.att||0;return r.grp=='Delivered'?(a<=1?'Delivered - 1st Attempt':'Delivered - Multiple Attempts'):/^RTO/.test(r.grp)?(a?'RTO - After Attempt(s)':'RTO - No Attempt Recorded'):r.grp=='Cancelled'?'Cancelled - Pre-Dispatch':/Lost|Damaged/.test(r.grp)?'Lost/Damaged in Transit':a?'NDR - Attempted, Delivery Pending':'No Attempt Yet - In Transit'}
function norm(r,src){const awb=g(r,'awb no','awb');if(!awb)return null;const st=String(g(r,'order status','order status (raw)')||''),rm=String(g(r,'remark / rto reason','rto reason','latest_remark')||'');
let city=tc(g(r,'customer city','shipping_city'));city=({Bangalore:'Bengaluru','New Delhi':'Delhi',Gurgaon:'Gurugram'})[city]||city;
const o={src,courier:g(r,'courier company')||src,awb:String(awb),order:String(g(r,'order number')||''),date:iso(g(r,'order date')),pay:tc(g(r,'payment method')),status:st,grp:grp(st),att:Number(g(r,'attempt count','delivery_attempts'))||0,zone:g(r,'zone','shipping_zone')??null,wh:g(r,'origin warehouse','warehouse nick name','warehouse_name')||'Unknown',city,state:g(r,'customer state')?tc(g(r,'customer state')):(CS[city]||'Unknown'),pin:g(r,'customer pincode','shipping_pincode')??null,pick:iso(g(r,'pickup date','order pickup date','pickuptime')),deliv:iso(g(r,'delivered date','order delivered date','delivertime')),edd:iso(g(r,'edd')),age:g(r,'ageing')??null,freight:src=='Blitz'?null:(g(r,'freight charge (inr)','total freight charge')??null),ndr:g(r,'ndr status')||'',remark:rm};
o.tat=o.pick&&o.deliv?(new Date(o.deliv)-new Date(o.pick))/864e5:null;o.month=o.date?o.date.slice(0,7):'';
o.dir=/rvp|dto|reverse|return pickup/i.test(st+rm)?'RVP/DTO':/^RTO/.test(o.grp)?'RTO':'Forward';o.mode=/\bair\b|flight/i.test(rm+st)?'Air':'Surface';o.astat=astat(o);return o}
function pick(src){const i=document.createElement('input');i.type='file';i.accept='.xlsx,.xls,.csv';i.onchange=async()=>{const f=i.files[0];if(!f)return;alert('Parsing '+f.name+'…');const wb=XLSX.read(await f.arrayBuffer(),{cellDates:true});let rows=[];
for(const n of wb.SheetNames){const a=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true}),h=a.findIndex(r=>r&&r.some(c=>/^awb( no)?$/i.test(String(c).trim())));if(h<0)continue;const hd=a[h].map(x=>String(x).trim().toLowerCase());const r=a.slice(h+1).map(x=>norm(Object.fromEntries(hd.map((k,j)=>[k,x[j]])),src)).filter(Boolean);if(r.length){rows=r;break}}
if(!rows.length)return alert('No AWB column found in this file.');
if(sb)for(let j=0;j<rows.length;j+=500){const{error}=await sb.from('shipments').upsert(rows.slice(j,j+500).map(d=>({source:src,awb:d.awb,order_no:d.order,d})),{onConflict:'source,awb'});if(error)return alert('Save failed: '+error.message)}
const m=new Map(ALL.map(r=>[r.src+r.awb,r]));rows.forEach(r=>m.set(r.src+r.awb,r));ALL=[...m.values()];ready();alert(src+': '+rows.length+' shipments loaded.')};i.click()}
// ---------- filters ----------
function ready(){IDX=new Map();ALL.forEach(r=>[r.awb,r.order].forEach(k=>{k=k.toLowerCase();if(k)IDX.set(k,[...(IDX.get(k)||[]),r])}));
$('#nav').innerHTML=TABS.map(t=>`<a data-t="${t}" onclick="TAB='${t}';go()">${t}</a>`).join('');
$('#fb').innerHTML=FIELDS.map(([k,l])=>{const o=[...new Set(ALL.map(r=>r[k]).filter(Boolean))].sort();return`<details class="ms"><summary id="s_${k}">${l}</summary><div><input type="search" placeholder="Search…" oninput="[...this.parentNode.querySelectorAll('label')].forEach(x=>x.hidden=!x.textContent.toLowerCase().includes(this.value.toLowerCase()))">${o.map(v=>`<label><input type="checkbox" onchange="tg('${k}',this)" value="${esc(v)}"> ${esc(v)}</label>`).join('')}</div></details>`}).join('')+`From <input type="date" onchange="DR.f=this.value;go()"> To <input type="date" onchange="DR.t=this.value;go()"><button class="g" onclick="SEL={};DR={f:'',t:''};ready()">Reset</button><b id="cnt"></b>`;go()}
function tg(k,e){(SEL[k]??=new Set())[e.checked?'add':'delete'](e.value);go()}
function go(){F=ALL.filter(r=>FIELDS.every(([k])=>!SEL[k]?.size||SEL[k].has(r[k]))&&(!DR.f||(r.date||'')>=DR.f)&&(!DR.t||(r.date||'')<=DR.t+'T23:59:59'));
FIELDS.forEach(([k,l])=>{const n=SEL[k]?.size;$('#s_'+k).textContent=l+(n?` (${n})`:'')});$('#cnt').textContent=` ${N(F.length,0)} of ${N(ALL.length,0)} shipments`;
document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.t==TAB));CH.forEach(c=>c.destroy());CH=[];
if(!ALL.length){$('#v').innerHTML='<h3>No data yet</h3><p>'+(ADMIN?'Use the Upload ITL / Upload Blitz buttons to load raw courier files.':'Data has not been uploaded yet. Please check back later.')+'</p>';return}
$('#v').innerHTML=({Overview:vOv,Courier:()=>tb(agg(F,r=>r.courier),'Courier'),State:()=>tb(agg(F,r=>r.state),'State'),City:()=>tb(agg(F,r=>r.city).slice(0,150),'City (top 150)'),'Monthly Trend':vMo,Attempts:vAt,RTO:vRto,'Open Queue':vOq,'Raw Data':vRaw,Assistant:vBot})[TAB]()
;if(TAB=='Overview')chartsOv();if(TAB=='Monthly Trend')chartsMo()}
// ---------- analytics ----------
function agg(rows,key){const m={};rows.forEach(r=>{const k=key(r)||'Unknown',a=m[k]??={k,n:0,d:0,rto:0,o:0,ts:0,tn:0,fs:0,fn:0};a.n++;if(r.grp=='Delivered'){a.d++;if(r.tat>=0){a.ts+=r.tat;a.tn++}}else if(/^RTO/.test(r.grp))a.rto++;else if(isO(r))a.o++;if(r.freight!=null){a.fs+=+r.freight;a.fn++}});return Object.values(m).sort((a,b)=>b.n-a.n)}
function tb(a,h){return`<div class="w"><table><tr><th>${h}</th><th class="r">Shipments</th><th class="r">Delivered</th><th class="r">Delivery %</th><th class="r">RTO %</th><th class="r">Open</th><th class="r">Avg TAT (d)</th><th class="r">Avg Freight ₹</th></tr>${a.map(x=>`<tr><td>${esc(x.k)}</td><td class="r">${N(x.n,0)}</td><td class="r">${N(x.d,0)}</td><td class="r">${P(x.d/x.n)}</td><td class="r">${P(x.rto/x.n)}</td><td class="r">${N(x.o,0)}</td><td class="r">${N(x.tn?x.ts/x.tn:null,2)}</td><td class="r">${N(x.fn?x.fs/x.fn:null,2)}</td></tr>`).join('')}</table></div><p style="color:#64748b">Freight is available for ITL couriers only (Blitz raw data carries no freight-cost field).</p>`}
function kpi(rows){const a=agg(rows,()=>'x')[0]||{n:0,d:0,rto:0,o:0,ts:0,tn:0,fs:0,fn:0},w=rows.filter(r=>r.edd&&r.deliv&&r.grp=='Delivered'),ot=w.filter(r=>r.deliv<=r.edd).length;return{a,ot:w.length?ot/w.length:NaN}}
function vOv(){const{a,ot}=kpi(F),c=[['Shipments',N(a.n,0)],['Delivery rate',P(a.d/a.n)],['RTO rate',P(a.rto/a.n)],['Open',N(a.o,0)],['Avg TAT (days)',N(a.tn?a.ts/a.tn:null,2)],['On-time vs EDD',P(ot)],['Avg freight ₹',N(a.fn?a.fs/a.fn:null,2)]];
return`<div class="k">${c.map(x=>`<div><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div><div class="g2"><div><canvas id="c1"></canvas></div><div><canvas id="c2"></canvas></div><div><canvas id="c3"></canvas></div><div><h3 style="margin-top:0">💡 Insights</h3><ul class="ins">${insights().map(i=>`<li>${i}</li>`).join('')}</ul></div></div>`}
function insights(){const o=[],cs=agg(F,r=>r.courier).filter(x=>x.n>=100);if(cs.length>1){const s=[...cs].sort((a,b)=>b.d/b.n-a.d/a.n),b=s[0],w=s.at(-1);o.push(`<b>${esc(b.k)}</b> leads delivery success at ${P(b.d/b.n)}; <b>${esc(w.k)}</b> trails at ${P(w.d/w.n)} — review allocation weights.`);const t=cs.filter(x=>x.tn).sort((a,b)=>b.ts/b.tn-a.ts/a.tn)[0];if(t)o.push(`Slowest average TAT: <b>${esc(t.k)}</b> at ${N(t.ts/t.tn,2)} days.`)}
const st=agg(F,r=>r.state).filter(x=>x.n>=50).sort((a,b)=>b.rto/b.n-a.rto/a.n)[0];if(st)o.push(`Highest RTO state: <b>${esc(st.k)}</b> (${P(st.rto/st.n)} of ${N(st.n,0)} shipments) — consider address/NDR verification there.`);
const cod=F.filter(r=>/cod/i.test(r.pay)),pp=F.filter(r=>/prepaid/i.test(r.pay)),rr=x=>x.filter(r=>/^RTO/.test(r.grp)).length/(x.length||1);if(cod.length>30&&pp.length)o.push(`COD RTO rate is ${P(rr(cod))} vs ${P(rr(pp))} for prepaid — a prepaid nudge could cut return cost.`);
const old=F.filter(r=>isO(r)&&r.age>7).length;if(old)o.push(`<span class="h">${N(old,0)} open shipments</span> are older than 7 days — see Open Queue.`);
const m=F.filter(r=>r.att>1&&r.grp=='Delivered').length;if(m)o.push(`${N(m,0)} deliveries needed 2+ attempts (${P(m/(F.filter(r=>r.grp=='Delivered').length||1))} of delivered) — an avoidable last-mile cost.`);return o.length?o:['Not enough data for insights under current filters.']}
function mk(id,t,type,labels,ds){CH.push(new Chart($(id),{type,data:{labels,datasets:ds},options:{plugins:{title:{display:true,text:t}},responsive:true}}))}
function chartsOv(){const s=agg(F,r=>r.grp),c=agg(F,r=>r.courier),m=agg(F,r=>r.month).filter(x=>x.k!='Unknown').sort((a,b)=>a.k>b.k?1:-1);
mk('#c1','Status mix','doughnut',s.map(x=>x.k),[{data:s.map(x=>x.n)}]);mk('#c2','Shipments by courier','bar',c.map(x=>x.k),[{label:'Shipments',data:c.map(x=>x.n),backgroundColor:'#2563eb'}]);mk('#c3','Monthly shipments','line',m.map(x=>x.k),[{label:'Shipments',data:m.map(x=>x.n),borderColor:'#2563eb'}])}
function vMo(){return`<div class="g2"><div><canvas id="m1"></canvas></div><div><canvas id="m2"></canvas></div></div>`+tb(agg(F,r=>r.month).sort((a,b)=>a.k>b.k?1:-1),'Month')}
function chartsMo(){const m=agg(F,r=>r.month).filter(x=>x.k!='Unknown').sort((a,b)=>a.k>b.k?1:-1);mk('#m1','Shipments','bar',m.map(x=>x.k),[{label:'Shipments',data:m.map(x=>x.n),backgroundColor:'#2563eb'}]);mk('#m2','Delivery % vs RTO %','line',m.map(x=>x.k),[{label:'Delivery %',data:m.map(x=>x.d/x.n*100),borderColor:'#16a34a'},{label:'RTO %',data:m.map(x=>x.rto/x.n*100),borderColor:'#dc2626'}])}
function vAt(){const cats=[...new Set(F.map(r=>r.astat))].sort(),cs=[...new Set(F.map(r=>r.courier))];return`<div class="w"><table><tr><th>Courier</th>${cats.map(c=>`<th class="r">${c}</th>`).join('')}<th class="r">Total</th></tr>${cs.map(c=>{const x=F.filter(r=>r.courier==c);return`<tr><td>${esc(c)}</td>${cats.map(k=>`<td class="r">${N(x.filter(r=>r.astat==k).length,0)}</td>`).join('')}<td class="r"><b>${N(x.length,0)}</b></td></tr>`}).join('')}</table></div><p style="color:#64748b">Logic: Delivered ≤1 attempt = 1st attempt; RTO split by attempts made; open shipments with attempts = NDR pending.</p>`}
function vRto(){const R=F.filter(r=>/^RTO/.test(r.grp)),ex=R.reduce((s,r)=>s+(+r.freight||0),0),aa=R.filter(r=>r.att>0).length,rm={};R.forEach(r=>{const k=r.remark||'No remark';rm[k]=(rm[k]||0)+1});
return`<div class="k"><div><span>RTO orders</span><b>${N(R.length,0)}</b></div><div><span>RTO rate</span><b>${P(R.length/(F.length||1))}</b></div><div><span>Freight exposure ₹</span><b>${N(ex,0)}</b></div><div><span>After-attempt share</span><b>${P(aa/(R.length||1))}</b></div></div><h3>By state (highest RTO %)</h3>`+tb(agg(F,r=>r.state).filter(x=>x.n>=20).sort((a,b)=>b.rto/b.n-a.rto/a.n).slice(0,15),'State')+`<h3>Top RTO reasons</h3><div class="w"><table>${Object.entries(rm).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="r">${v}</td></tr>`).join('')}</table></div>`}
function vOq(){const q=F.filter(isO).sort((a,b)=>(b.age||0)-(a.age||0)).slice(0,200);return`<p>Top ${q.length} open shipments by ageing.</p><div class="w"><table><tr><th>Priority</th><th>Courier</th><th>AWB</th><th>Order</th><th>City</th><th>Status</th><th class="r">Attempts</th><th class="r">Age (d)</th><th>EDD</th><th>Remark</th></tr>${q.map(r=>`<tr><td class="${r.age>7?'h':r.age>3?'mm':''}">${r.age>7?'High':r.age>3?'Medium':'Normal'}</td><td>${esc(r.courier)}</td><td>${esc(r.awb)}</td><td>${esc(r.order)}</td><td>${esc(r.city)}</td><td>${esc(r.status)}</td><td class="r">${r.att}</td><td class="r">${r.age??'–'}</td><td>${fd(r.edd)}</td><td>${esc(r.remark)}</td></tr>`).join('')}</table></div>`}
function vRaw(){return`<p>Previewing 100 of ${N(F.length,0)} rows. The Download Excel button exports ${Object.values(SEL).some(s=>s.size)||DR.f||DR.t?'the <b>filtered</b> rows':'the <b>complete</b> raw file'}.</p><div class="w"><table><tr>${COLS.slice(0,16).map(c=>`<th>${c[1]}</th>`).join('')}</tr>${F.slice(0,100).map(r=>`<tr>${COLS.slice(0,16).map(([k])=>`<td>${esc(k=='date'?fd(r[k]):r[k])}</td>`).join('')}</tr>`).join('')}</table></div>`}
function dl(){if(!ALL.length)return alert('No data to download.');const f=Object.values(SEL).some(s=>s.size)||DR.f||DR.t,rows=F.map(r=>Object.fromEntries(COLS.map(([k,l])=>[l,['date','pick','deliv','edd'].includes(k)&&r[k]?new Date(r[k]):r[k]]))),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows,{cellDates:true}),'Raw Data');XLSX.writeFile(wb,`BOHECO_${f?'filtered':'complete'}_raw_${new Date().toISOString().slice(0,10)}.xlsx`)}
// ---------- assistant ----------
function vBot(){return`<h3 style="margin-top:0">🤖 Order Assistant</h3><p style="color:#64748b">Ask about any order number or AWB (searches all data, ignoring filters). Try: "Where is BOHECO50776?", "freight for 77204018205", "why was it RTO".</p><div id="chat"><div class="mg a">Hi! Share an order number or AWB and I'll tell you everything I know.</div></div><div style="display:flex;gap:8px;margin-top:10px"><input id="q" style="flex:1;padding:9px;border:1px solid #e2e8f0;border-radius:6px" placeholder="e.g. Status of order BOHECO50776" onkeydown="if(event.key=='Enter')ask()"><button onclick="ask()">Send</button></div>`}
function ask(){const q=$('#q').value.trim();if(!q)return;$('#q').value='';const c=$('#chat');c.innerHTML+=`<div class="mg u">${esc(q)}</div><div class="mg a">${esc(reply(q))}</div>`;c.scrollTop=c.scrollHeight}
function reply(q){let h;for(const t of q.match(/[A-Za-z0-9_-]{5,}/g)||[]){h=IDX.get(t.toLowerCase());if(h)break}if(!h)return'I could not find an order or AWB in your message. Please paste the full order number or AWB.';
const now=Date.now();return h.map(r=>{let s=`📦 Order ${r.order} · AWB ${r.awb}\nCourier: ${r.courier} (${r.src}) · ${r.pay||'n/a'}\nStatus: ${r.status} [${r.grp}]\nDestination: ${r.city}, ${r.state}\nOrdered: ${fd(r.date)} · Picked up: ${fd(r.pick)}`;const I=/freight|cost|charge/i.test(q),E=/eta|edd|when|expect|late|delay/i.test(q),A=/attempt|ndr/i.test(q),W=/rto|return|why|reason/i.test(q),any=I||E||A||W;
if(!any||E){s+=`\nEDD: ${fd(r.edd)}`;if(r.grp=='Delivered')s+=`\nDelivered: ${fd(r.deliv)}${r.tat!=null?` in ${N(r.tat,1)} days`:''}${r.edd&&r.deliv>r.edd?' (after EDD)':''}`;else if(isO(r)&&r.edd&&new Date(r.edd)<now)s+=`\n⚠ Delayed by ~${Math.ceil((now-new Date(r.edd))/864e5)} day(s) past EDD.`}
if(!any||A)s+=`\nDelivery attempts: ${r.att} → ${r.astat}${r.ndr?'\nNDR: '+r.ndr:''}`;if(!any||I)s+=`\nFreight: ${r.freight!=null?'₹'+N(r.freight,2):'not available (Blitz data has no freight field)'}`;if((!any||W)&&(r.remark||/^RTO/.test(r.grp)))s+=`\nLatest remark / RTO reason: ${r.remark||'none recorded'}`;return s}).join('\n\n')}
boot();
</script></body></html>
